name: Wyxen Player Tracker

on:
  schedule:
    # Her 5 dakikada bir çalışır (GitHub Actions minimum interval)
    # Not: GitHub Actions cron kesin zamanlı değildir, birkaç dakika gecikebilir
    - cron: '*/5 * * * *'
  
  # Manuel olarak çalıştırma seçeneği
  workflow_dispatch:

# Aynı anda birden fazla workflow çalışmasını engelle
concurrency:
  group: player-tracker
  cancel-in-progress: false

# Repository'ye yazma izni
permissions:
  contents: write

jobs:
  track-players:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run tracker
        run: |
          python tracker.py
      
      - name: Configure Git
        run: |
          git config --global user.name "Wyxen Tracker Bot"
          git config --global user.email "tracker@wyxen.local"
      
      - name: Commit and push if changed
        run: |
          git add data/stats.json
          git diff --staged --quiet || git commit -m "Update player statistics - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
